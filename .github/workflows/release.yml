name: Build DMG
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (z. B. v3.0) – leer lassen für reinen Test-Build'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
        env:
          CI: "true"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: DynamicNotch ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: DynamicNotch.dmg
